user  nobody;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # Define el grupo de servidores backend que recibirán las solicitudes
    upstream backend_servers {
        server localhost:3000;  # Primer servidor backend en el puerto 3000
        server localhost:3001;  # Segundo servidor backend en el puerto 3001
    }

    # Se incluyen los tipos MIME para manejar diferentes tipos de archivos
    include       mime.types;
    default_type  application/octet-stream;

    # Permite la transferencia de archivos eficiente
    sendfile        on;

    # Define el tiempo de espera para mantener la conexión viva
    keepalive_timeout  65;

    server {
        listen       80;  # El servidor escucha en el puerto 80 (HTTP)
        server_name  localhost;  # El nombre del servidor es 'localhost'

        # Este bloque maneja todas las solicitudes entrantes (balanceo de carga)
        # Redirige las solicitudes a los servidores backend definidos en 'upstream'
        location / {
            proxy_pass http://backend_servers;  # Redirige al grupo de servidores backend
            proxy_set_header Host $host;  # Pasa la cabecera del host original
            proxy_set_header X-Real-IP $remote_addr;  # Pasa la IP del cliente real
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Pasa las cabeceras de proxy
        }

        # Si se necesita manejar rutas específicas para un servidor backend
        # Descomentar y usar las siguientes líneas si se quiere redirigir de forma específica a los servidores:
        # location /server1 {
        #     proxy_pass http://backend_servers;
        # }
        # location /server2 {
        #     proxy_pass http://backend_servers;
        # }

        # Bloque para manejar rutas adicionales, por ejemplo, '/user' (comentado si no se usa)
        # location /user {
        #     proxy_pass http://session_based;  # Definir otro grupo 'session_based' si es necesario
        # }
    }
}
