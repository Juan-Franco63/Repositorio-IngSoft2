worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Upstream block para definir los servidores Node.js
    upstream nodejs_backend {
        least_conn;
        server 127.0.0.1:3001;  # server1.js
        server 127.0.0.1:3002;  # server2.js
    }

    server {
        listen 80;  # Nginx recibirá solicitudes en el puerto 80
        server_name localhost;

        # Ruta para server1
        location /server1/ {
            rewrite ^/server1/(.*) /$1 break;  # Elimina "/server1" antes de pasar al backend
            proxy_pass http://nodejs_backend;  # Pasa la solicitud al backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ruta para server2
        location /server2/ {
            rewrite ^/server2/(.*) /$1 break;  # Elimina "/server2" antes de pasar al backend
            proxy_pass http://nodejs_backend;  # Pasa la solicitud al backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ruta raíz, opcional, para redirigir todo el tráfico a un servidor predeterminado
        location / {
            proxy_pass http://nodejs_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}